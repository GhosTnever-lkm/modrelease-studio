name: Mod release preflight

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install -e ".[test]"
      - name: Run regression tests with line coverage
        run: coverage run --source=modrelease_studio -m unittest discover -s tests -v
      - name: Enforce line coverage floor
        run: coverage report --include="modrelease_studio/*.py" --fail-under=80
      - name: Verify Linux/macOS checksum instructions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf 'synthetic checksum fixture\n' > ModRelease-Studio-v0.0.0.zip
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 ModRelease-Studio-v0.0.0.zip > ModRelease-Studio-v0.0.0.zip.sha256
            shasum -a 256 -c ModRelease-Studio-v0.0.0.zip.sha256
          else
            sha256sum ModRelease-Studio-v0.0.0.zip > ModRelease-Studio-v0.0.0.zip.sha256
            sha256sum --check ModRelease-Studio-v0.0.0.zip.sha256
          fi
      - name: Verify Windows PowerShell checksum instructions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = ".\ModRelease-Studio-v0.0.0.zip"
          $checksumFile = "$archive.sha256"
          Set-Content -NoNewline -Path $archive -Value "synthetic checksum fixture"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ModRelease-Studio-v0.0.0.zip" | Set-Content -NoNewline -Path $checksumFile
          $checksumFiles = @(Get-ChildItem -File -Filter "ModRelease-Studio-*.zip.sha256")
          if ($checksumFiles.Count -ne 1) { throw "Expected exactly one matching sidecar." }
          $checksumFile = $checksumFiles[0].FullName
          $archive = $checksumFile -replace '\.sha256$', ''
          $expected = ((Get-Content $checksumFile -Raw) -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 mismatch; do not use this archive." }
          Write-Output "SHA-256 OK"
      - name: Scan example project
        run: |
          python -m pip install .
          modrelease scan examples/paradox-mod --md-out modrelease-report.md --json-out modrelease-report.json
          modrelease scan examples/paradox-mod --config examples/policies/paradox-release.toml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modrelease-report
          path: |
            modrelease-report.md
            modrelease-report.json
