name: ModRelease Studio release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build release archive and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="ModRelease-Studio-v${version}.zip"
          zip -r "dist-${archive}" modrelease_studio tests README.md CHANGELOG.md CONTRIBUTING.md LICENSE SECURITY.md pyproject.toml modrelease.example.toml examples/policies/paradox-release.toml examples/policies/paradox-release-report.md
          mv "dist-${archive}" "${archive}"
          sha256sum "${archive}" > "${archive}.sha256"
          sha256sum --check "${archive}.sha256"
      - name: Smoke-test packaged release archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          extracted="$RUNNER_TEMP/modrelease-release-archive"
          venv="$RUNNER_TEMP/modrelease-release-venv"
          mkdir -p "$extracted"
          unzip -q "ModRelease-Studio-v${version}.zip" -d "$extracted"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check "$extracted"
          actual="$($venv/bin/modrelease --version)"
          test "$actual" = "modrelease $version"
          "$venv/bin/modrelease" scan "$GITHUB_WORKSPACE/examples/paradox-mod" \
            --md-out "$RUNNER_TEMP/modrelease-smoke.md" \
            --json-out "$RUNNER_TEMP/modrelease-smoke.json"
          "$venv/bin/python" - "$RUNNER_TEMP/modrelease-smoke.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          if report.get("status") != "READY":
              raise SystemExit(f"Release archive smoke scan was not READY: {report.get('status')}")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ModRelease-Studio-v${GITHUB_REF_NAME#v}.zip" "ModRelease-Studio-v${GITHUB_REF_NAME#v}.zip.sha256" --title "ModRelease Studio ${GITHUB_REF_NAME}" --generate-notes
