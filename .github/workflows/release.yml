name: ModRelease Studio release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build release archive and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="ModRelease-Studio-v${version}.zip"
          zip -r "dist-${archive}" modrelease_studio tests README.md CHANGELOG.md CONTRIBUTING.md LICENSE SECURITY.md pyproject.toml modrelease.example.toml examples/policies/paradox-release.toml examples/policies/paradox-release-report.md
          mv "dist-${archive}" "${archive}"
          sha256sum "${archive}" > "${archive}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ModRelease-Studio-v${GITHUB_REF_NAME#v}.zip" "ModRelease-Studio-v${GITHUB_REF_NAME#v}.zip.sha256" --title "ModRelease Studio ${GITHUB_REF_NAME}" --generate-notes
